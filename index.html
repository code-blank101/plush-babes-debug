<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
<title>PLUSH BABES — where the girlies shop</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Indie+Flower&family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<link rel="stylesheet" href="components/header.css">
<style>
  html { scroll-behavior: smooth; }
  body { font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased; overflow-x:hidden; background:#FFFBFD; margin:0; padding:0; }
  .font-tagline { font-family:'Indie Flower',cursive; }
  .cat-scroll::-webkit-scrollbar { display:none; } .cat-scroll{-ms-overflow-style:none;scrollbar-width:none;}
  #siteHeader { 
    --bg-opacity:1; 
    background-color:rgba(255,142,186,var(--bg-opacity,1)) !important; 
    position:fixed !important; 
    top:0; left:0; right:0; 
    width:100%; 
    z-index:1000;
  }
  #siteHeader.is-scrolled { 
    box-shadow:0 4px 20px rgba(0,0,0,0.08); 
    backdrop-filter:blur(12px); 
    -webkit-backdrop-filter:blur(12px);
  }
  #plush-header { 
    height:124px; 
    background:#FF8EBA; 
    width:100%; 
  }
  body.header-collapsed #plush-header { height:68px; }
  #heroBanner { 
    margin-top:0 !important; 
    margin-bottom:0 !important;
    background:#FF8EBA;
    width:100%;
  }
  .ticker-viewport { overflow:hidden; background:black; }
  .ticker-track { display:flex; width:max-content; animation:tickerScroll 24s linear infinite; }
  .ticker-viewport:hover .ticker-track { animation-play-state:paused; }
  @keyframes tickerScroll { from{transform:translateX(0);} to{transform:translateX(-50%);} }
  @keyframes shimmer { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
  .skeleton-shimmer { position: relative; overflow: hidden; background: #F0F0F0; }
  .skeleton-shimmer::after { content: ""; position: absolute; top:0; left:0; width:100%; height:100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6), transparent); animation: shimmer 1.5s infinite; }
</style>
</head>
<body class="bg-[#FFFBFD]">
<!-- HEADER MOUNT -->
<div id="plush-header"></div>
<div id="plush-search"></div>
<div id="plush-mobile-search"></div>
<!-- Full page skeleton - covers whole index.html until JS loads -->
<div id="plush-initial-skeleton" class="fixed inset-0 bg-[#FFFBFD] z-[9999] overflow-y-auto">
  <div class="w-full h-[124px] bg-[#FF8EBA] animate-pulse"></div>
  <div class="w-full bg-[#FF8EBA] py-6">
    <div class="max-w-[1280px] mx-auto px-4 grid grid-cols-1 md:grid-cols-[1.1fr_1.9fr] gap-4">
      <div class="space-y-3"><div class="h-3 w-20 bg-white/30 rounded-full"></div><div class="h-8 w-48 bg-white/40 rounded"></div><div class="h-9 w-24 bg-white rounded-full mt-4"></div></div>
      <div class="hidden md:grid grid-cols-3 gap-3"><div class="aspect-[3/4] bg-white/20 rounded-[12px] skeleton-shimmer"></div><div class="aspect-[3/4] bg-white/20 rounded-[12px] skeleton-shimmer"></div><div class="aspect-[3/4] bg-white/20 rounded-[12px] skeleton-shimmer"></div></div>
      <div class="grid md:hidden grid-cols-2 gap-2"><div class="aspect-[3/4] bg-white/20 rounded-[12px] skeleton-shimmer"></div><div class="aspect-[3/4] bg-white/20 rounded-[12px] skeleton-shimmer"></div></div>
    </div>
  </div>
  <div class="w-[98%] md:w-[92%] mx-auto mt-4 bg-white rounded-[20px] p-6">
    <div class="h-3 w-48 bg-[#F0F0F0] rounded-full mx-auto mb-6"></div>
    <div class="grid grid-cols-4 sm:grid-cols-6 md:grid-cols-8 gap-6">
      <div class="flex flex-col items-center gap-2"><div class="w-20 h-20 rounded-full bg-[#F0F0F0] skeleton-shimmer"></div><div class="h-2 w-12 bg-[#F0F0F0] rounded"></div></div>
      <div class="flex flex-col items-center gap-2"><div class="w-20 h-20 rounded-full bg-[#F0F0F0] skeleton-shimmer"></div><div class="h-2 w-12 bg-[#F0F0F0] rounded"></div></div>
      <div class="flex flex-col items-center gap-2"><div class="w-20 h-20 rounded-full bg-[#F0F0F0] skeleton-shimmer"></div><div class="h-2 w-12 bg-[#F0F0F0] rounded"></div></div>
      <div class="flex flex-col items-center gap-2"><div class="w-20 h-20 rounded-full bg-[#F0F0F0] skeleton-shimmer"></div><div class="h-2 w-12 bg-[#F0F0F0] rounded"></div></div>
      <div class="flex flex-col items-center gap-2"><div class="w-20 h-20 rounded-full bg-[#F0F0F0] skeleton-shimmer"></div><div class="h-2 w-12 bg-[#F0F0F0] rounded"></div></div>
      <div class="flex flex-col items-center gap-2"><div class="w-20 h-20 rounded-full bg-[#F0F0F0] skeleton-shimmer"></div><div class="h-2 w-12 bg-[#F0F0F0] rounded"></div></div>
      <div class="flex flex-col items-center gap-2"><div class="w-20 h-20 rounded-full bg-[#F0F0F0] skeleton-shimmer"></div><div class="h-2 w-12 bg-[#F0F0F0] rounded"></div></div>
      <div class="flex flex-col items-center gap-2"><div class="w-20 h-20 rounded-full bg-[#F0F0F0] skeleton-shimmer"></div><div class="h-2 w-12 bg-[#F0F0F0] rounded"></div></div>
    </div>
  </div>
  <div class="max-w-[1280px] mx-auto px-4 py-10">
    <div class="h-3 w-20 bg-[#F0F0F0] rounded-full mx-auto mb-6"></div>
    <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
      <div class="border border-black/5 rounded-[18px] overflow-hidden bg-white"><div class="aspect-[4/5] bg-[#F0F0F0] skeleton-shimmer"></div><div class="p-3 space-y-2"><div class="h-3 w-full bg-[#F0F0F0] rounded"></div><div class="h-3 w-3/4 bg-[#F0F0F0] rounded"></div></div></div>
      <div class="border border-black/5 rounded-[18px] overflow-hidden bg-white"><div class="aspect-[4/5] bg-[#F0F0F0] skeleton-shimmer"></div><div class="p-3 space-y-2"><div class="h-3 w-full bg-[#F0F0F0] rounded"></div><div class="h-3 w-3/4 bg-[#F0F0F0] rounded"></div></div></div>
      <div class="border border-black/5 rounded-[18px] overflow-hidden bg-white"><div class="aspect-[4/5] bg-[#F0F0F0] skeleton-shimmer"></div><div class="p-3 space-y-2"><div class="h-3 w-full bg-[#F0F0F0] rounded"></div><div class="h-3 w-3/4 bg-[#F0F0F0] rounded"></div></div></div>
      <div class="border border-black/5 rounded-[18px] overflow-hidden bg-white"><div class="aspect-[4/5] bg-[#F0F0F0] skeleton-shimmer"></div><div class="p-3 space-y-2"><div class="h-3 w-full bg-[#F0F0F0] rounded"></div><div class="h-3 w-3/4 bg-[#F0F0F0] rounded"></div></div></div>
    </div>
  </div>
</div>
<!-- BANNER -->
<section id="heroBanner" class="w-full bg-[#FF8EBA] relative">
  <div class="max-w-[1280px] mx-auto px-4 md:px-6 py-5 md:py-7 grid grid-cols-1 md:grid-cols-[1.1fr_1.9fr] gap-4 md:gap-6 items-center">
    <div class="text-white">
      <p class="text-[11px] md:text-[12px] font-medium tracking-wide opacity-90">#PlushBabesSale</p>
      <h1 class="font-black text-[24px] md:text-[36px] leading-[0.9] mt-1.5 uppercase tracking-tight">
        Save Big On<br>Women's Top Sellers
      </h1>
      <div class="mt-4 md:mt-6">
        <button disabled class="h-9 md:h-10 px-5 md:px-6 rounded-[9px] bg-white text-[#FF4D9A] text-[11px] md:text-[12px] font-black tracking-wide cursor-default">
          SAVE NOW
        </button>
      </div>
    </div>
    <div>
      <div class="hidden md:grid grid-cols-3 gap-3">
        <img src="public/images/Kelphy.jpeg" alt="" class="w-full aspect-[3/4] object-cover rounded-[12px] border-[3px] border-white shadow-[0_8px_24px_rgba(0,0,0,0.15)]" />
        <img src="public/images/Kelphy-3.jpeg" alt="" class="w-full aspect-[3/4] object-cover rounded-[12px] border-[3px] border-white shadow-[0_8px_24px_rgba(0,0,0,0.15)]" />
        <img src="public/images/Kelphy-2.jpeg" alt="" class="w-full aspect-[3/4] object-cover rounded-[12px] border-[3px] border-white shadow-[0_8px_24px_rgba(0,0,0,0.15)]" />
      </div>
      <div class="grid md:hidden grid-cols-2 gap-2.5">
        <img src="public/images/Kelphy.jpeg" alt="" class="w-full aspect-[3/4] object-cover rounded-[12px] border-2 border-white shadow-[0_4px_16px_rgba(0,0,0,0.12)]" />
        <img src="public/images/Kelphy-3.jpeg" alt="" class="w-full aspect-[3/4] object-cover rounded-[12px] border-2 border-white shadow-[0_4px_16px_rgba(0,0,0,0.12)]" />
      </div>
    </div>
  </div>
</section>
<!-- PRODUCT GRID -->
<div id="plush-product-grid"></div>
<!-- TICKER -->
<div class="bg-black py-3 ticker-viewport w-full">
  <div id="tickerTrack" class="ticker-track text-white text-[12px] font-bold tracking-wide whitespace-nowrap">
    <span class="px-6 flex items-center gap-6">EARLY ACCESS NOW OPEN <span class="opacity-30">•</span></span>
    <span class="px-6 flex items-center gap-6">WISHLIST GROUPS <span class="opacity-30">•</span></span>
    <span class="px-6 flex items-center gap-6">GROUPAY — SPLIT ANY ORDER <span class="opacity-30">•</span></span>
    <span class="px-6 flex items-center gap-6">PINTEREST TAILORED FEED <span class="opacity-30">•</span></span>
    <span class="px-6 flex items-center gap-6">FOUNDING VENDOR APPLICATIONS OPEN <span class="opacity-30">•</span></span>
    <span class="px-6 flex items-center gap-6">🇬🇭 MADE IN GHANA <span class="opacity-30">•</span></span>
  </div>
</div>
<div id="plush-footer"></div>
<script src="components/loader.js"></script>
<script src="public/js/script.js"></script>
</body>
</html>
