<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
<title>PLUSH BABES — Wishlist</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Indie+Flower&family=Inter:wght@400;500;600;700;900&family=Playfair+Display:wght@700&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body { font-family: 'Inter', sans-serif; background:#FFFBFD; padding-top: 68px; margin:0; -webkit-font-smoothing:antialiased; }
  .font-tagline{ font-family:'Indie Flower',cursive; }
  #siteHeader{ background:#FF8EBA; position: fixed !important; top:0; left:0; right:0; width:100%; z-index:50; }
  .icon-btn{ width:38px;height:38px;display:flex;align-items:center;justify-content:center;border-radius:9999px;color:white; transition: background 150ms ease, transform 100ms ease; }
  .icon-btn:hover{ background: rgba(255,255,255,0.15); }
  .icon-btn:active{ transform: scale(0.92); }
  #suggestDropdown { display: none; box-shadow: 0 16px 40px rgba(0,0,0,0.15); max-height: 70vh; overflow-y: auto; }
  #suggestDropdown.is-open { display: block !important; }
  #mobileSuggestDropdown { display: none; box-shadow: 0 16px 40px rgba(0,0,0,0.12); max-height: 80vh; overflow-y: auto; }
  #mobileSuggestDropdown.is-open { display: block !important; }
  #mobileHeaderSearch { display: none; }
  #mobileHeaderSearch.is-open { display: flex !important; }
  #headerMainRow.is-hidden { opacity: 0; pointer-events: none; }
  #menuDropdown { display: none; width: 220px; background: white; color: black; border-radius: 14px; box-shadow: 0 16px 40px rgba(0,0,0,0.18); border: 1px solid rgba(0,0,0,0.06); overflow: hidden; }
  #menuDropdown.is-open { display: block; }
  .menu-item { display: block; width: 100%; text-align: left; padding: 10px 14px; font-size: 13px; font-weight: 500; color: black; }
  .menu-item:hover { background: #FFF0F6; }
  .menu-divider { border-top: 1px solid rgba(0,0,0,0.08); margin: 4px 0; }
  .acct-empty-icon{ color:#ABABAB; width:clamp(48px,14vw,64px); height:clamp(48px,14vw,64px); }
  .suggest-item:hover { background: #FFF0F6; }
  @media (min-width: 768px) { #mobileSearchBtn { display: none !important; } }
</style>
</head>
<body>
<header id="siteHeader">
  <div class="max-w-[1280px] mx-auto px-4 relative">
    <div id="headerMainRow" class="h-[68px] flex items-center justify-between gap-4">
      <div class="flex items-center shrink-0">
        <button id="logoTextBtn" class="flex flex-col leading-none text-left" onclick="window.location.href='/'">
          <span class="font-black tracking-tight text-white text-[20px]">PLUSH BABES</span>
          <span class="font-tagline text-white/90 text-[12px] mt-[1px]">where the girlies shop</span>
        </button>
      </div>
      <div id="desktopSearchWrap" class="hidden md:block flex-1 max-w-[420px] relative">
        <div class="w-full h-[38px] bg-white rounded-full flex items-center px-4 gap-2">
          <input id="searchInput" placeholder="Search dresses, bags, shoes..." autocomplete="off" class="bg-transparent outline-none text-[13px] w-full placeholder:text-black/40" />
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2.2" class="opacity-50 shrink-0"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        </div>
        <div id="suggestDropdown" class="absolute top-[46px] left-0 w-full bg-white rounded-[16px] border border-black/5 overflow-hidden z-[100]">
          <div class="p-2"><p class="text-[10px] font-bold tracking-widest text-black/40 px-3 py-2">SUGGESTIONS</p><div id="suggestList"></div></div>
        </div>
      </div>
      <div class="flex items-center gap-1">
        <button id="mobileSearchBtn" class="icon-btn" aria-label="Search">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        </button>
        <a href="wishlist.html" class="icon-btn" aria-label="Wishlist">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
        </a>
        <a href="bag.html" class="icon-btn relative" aria-label="Bag">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 7h12l-1 12H7L6 7z"/><path d="M9 7V5a3 3 0 016 0v2"/></svg>
          <span id="bagCount" class="absolute -top-1 -right-1 bg-white text-black text-[8px] w-[14px] h-[14px] rounded-full flex items-center justify-center font-bold border border-black/10">0</span>
        </a>
        <a href="account.html#overview" class="icon-btn hidden sm:flex" aria-label="Account">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-6 8-6s8 2 8 6"/></svg>
        </a>
        <div class="relative">
          <button id="menuBtn" class="icon-btn" aria-label="Menu">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
          </button>
          <div id="menuDropdown" class="absolute right-0 top-[46px] z-[100]"><div id="menuContent"></div></div>
        </div>
      </div>
    </div>
    <div id="mobileHeaderSearch" class="absolute inset-x-0 top-0 h-[68px] bg-[#FF8EBA] z-30 items-center gap-2 px-4">
      <button id="mobileSearchBackInline" aria-label="Back" class="w-9 h-9 rounded-full bg-white/15 text-white flex items-center justify-center shrink-0">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <div class="flex-1 h-[38px] bg-white rounded-full flex items-center px-4 gap-2">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2.2" class="opacity-40 shrink-0"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="mobileSearchInput" placeholder="Search dresses, bags, shoes..." autocomplete="off" class="bg-transparent outline-none text-[13px] w-full placeholder:text-black/40" />
      </div>
    </div>
    <div id="mobileSuggestDropdown" class="absolute top-[68px] left-0 right-0 bg-white border-t border-black/5 z-[99]">
      <div class="p-3"><p class="text-[10px] font-bold tracking-widest text-black/40 px-2 py-2">SUGGESTIONS</p><div id="mobileSuggestList"></div></div>
    </div>
  </div>
</header>
<div class="max-w-[1280px] mx-auto px-4 py-8">
  <div class="flex items-end justify-between mb-6">
    <div><h1 class="font-black text-[22px] md:text-[26px]">Wishlist</h1><p class="text-[11px] text-black/40 mt-1">Your groups • customize and share lists</p></div>
    <span id="wishlistCount" class="text-[11px] font-bold tracking-widest text-black/30 uppercase">0 ITEMS</span>
  </div>
  <div id="wishlistEmptyState" class="bg-white border border-[#eee] rounded-[20px] py-16 px-6 flex flex-col items-center text-center">
    <svg class="acct-empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
    <h2 class="font-black text-[18px] mt-5">Your wishlist is empty</h2><p class="text-black/50 text-[13px] mt-2">Tap the heart on any item</p><a href="/" class="mt-6 bg-black text-white font-bold text-[13px] px-7 py-3 rounded-[9px] inline-block">Shop Plush</a>
  </div>
  <div id="wishlistFilledState" class="hidden space-y-8">
    <div>
      <div class="flex items-center justify-between mb-3"><h3 class="font-black text-[14px]">Your groups</h3><button id="createGroupBtnTop" class="h-8 px-4 rounded-full bg-black text-white text-[11px] font-bold">+ New group</button></div>
      <div id="wishlistGroupsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
    </div>
    <div>
      <h3 class="font-black text-[14px] mb-3">Saved items</h3>
      <div id="wishlistItemsGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3"></div>
    </div>
  </div>
</div>
<div id="heartGroupsModal" class="fixed inset-0 bg-black/40 z-[400] hidden items-end md:items-center justify-center p-0 md:p-4">
  <div class="bg-white w-full md:max-w-[380px] rounded-t-[20px] md:rounded-[20px] max-h-[85vh] overflow-hidden flex flex-col">
    <div class="p-5 border-b border-black/5 flex justify-between items-center"><h3 class="font-black text-[15px]">Save to</h3><button id="closeHeartModal" class="w-8 h-8 rounded-full bg-black text-white">x</button></div>
    <div class="overflow-y-auto p-3 space-y-2 flex-1">
      <button id="addToGeneralWishlistBtn" class="w-full flex items-center gap-3 p-3 rounded-[14px] border border-black/10 hover:bg-[#FFF0F6] text-left"><span class="w-10 h-10 rounded-full bg-black text-white flex items-center justify-center">♥</span><span><span class="font-bold text-[13px] block">General wishlist</span><span class="text-[11px] text-black/40">Save without group</span></span></button>
      <p class="text-[10px] font-bold tracking-widest uppercase text-black/30 px-2 pt-2">Recent groups</p>
      <div id="heartGroupsList" class="space-y-1"></div>
      <button id="heartCreateNewGroupBtn" class="w-full h-11 rounded-full border border-dashed border-black/20 text-[12px] font-bold mt-2">+ Create new group</button>
    </div>
    <div id="heartProductPreview" class="p-3 border-t border-black/5 bg-[#FAFAFA] flex gap-3 items-center"></div>
  </div>
</div>
<div id="createGroupModal" class="fixed inset-0 bg-black/40 z-[500] hidden items-center justify-center p-4">
  <div class="bg-white rounded-[20px] max-w-[400px] w-full p-6">
    <div class="flex justify-between items-center"><h3 class="font-black">New group</h3><button id="closeGroupModal" class="w-8 h-8 rounded-full bg-black text-white">x</button></div>
    <input id="groupNameInput" placeholder="e.g. Birthday Glam" class="w-full mt-4 h-11 rounded-full border border-black/10 px-4 text-[13px] outline-none"/>
    <textarea id="groupDescInput" placeholder="Description (optional)" class="w-full mt-3 h-20 rounded-[16px] border border-black/10 p-3 text-[13px] outline-none"></textarea>
    <button id="saveGroupBtn" class="w-full h-11 rounded-full bg-black text-white font-bold text-[13px] mt-4">Create</button>
  </div>
</div>
<div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-black text-white text-[12px] font-bold px-4 py-2 rounded-full hidden z-[600]"></div>
<script>
// === MENU (same as bag.html) ===
const menuBtn = document.getElementById('menuBtn');
const menuDropdown = document.getElementById('menuDropdown');
if(menuBtn && menuDropdown){
  document.getElementById('menuContent').innerHTML = `
    <a href="/" class="menu-item">Home</a>
    <a href="account.html" class="menu-item">My Plush Account</a>
    <a href="account.html#orders" class="menu-item">Orders</a>
    <a href="wishlist.html" class="menu-item">Wishlist</a>
    <a href="bag.html" class="menu-item">Bag</a>
    <a href="account.html#address" class="menu-item">Address Book</a>
    <div class="menu-divider"></div>
    <a href="#" class="menu-item" style="color:#DC2626;">Logout</a>
  `;
  menuBtn.addEventListener('click', (e)=>{ e.stopPropagation(); menuDropdown.classList.toggle('is-open'); });
  document.addEventListener('click', (e)=>{ if(!menuDropdown.contains(e.target) && e.target!==menuBtn) menuDropdown.classList.remove('is-open'); });
}
// === UNIFIED SEARCH - SAME AS BAG.HTML, SVG ICONS ONLY ===
const SUPABASE_URL = "https://nkrvaaiasynlsfupdszq.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5rcnZhYWlhc3lubHNm [STRIPPED 75 bytes].Ag0mZOMwMtSgbB2zW818X7fD0yOaqufls0ib2nCtlQI";
const SUGGESTIONS = ["Nails acrylic set", "Bags mini croc", "Shoes chunky heels","Wigs frontal lace", "Dresses satin slip", "Curve bodycon dress", "Dress", "Bags", "Shoes", "Wigs"];
const CATEGORIES = ["Dresses", "Bags", "Shoes", "Wigs", "Nails", "Accessories", "Curve", "Beauty", "Clothing"];
let allProductsCache = [];
function normalizeText(str){
  return (str||'').toLowerCase().trim().replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ');
}
function getProductSuggestions(query){
  const q = normalizeText(query);
  if(!q) return { products: allProductsCache.slice(0,6), terms: SUGGESTIONS.slice(0,6), categories: [] };
  const tokens = q.split(' ').filter(Boolean);
  let products = [];
  if(allProductsCache.length){
    const scored = allProductsCache.map(p=>{
      const title = normalizeText(p.title);
      const cat = normalizeText(p.category);
      const desc = normalizeText(p.description||'');
      let score = 0;
      if(title === q) score += 100;
      if(title.includes(q)) score += 90;
      tokens.forEach(tok=>{
        if(tok.length < 2) return;
        if(title.includes(tok)) score += 20;
        if(cat.includes(tok)) score += 15;
        if(desc.includes(tok)) score += 5;
        if(title.split(' ').some(w=> w.startsWith(tok))) score += 10;
        if(tok.length >=3){
          const plural = tok + 'es';
          const plural2 = tok + 's';
          if(title.includes(plural) || title.includes(plural2) || cat.includes(plural) || cat.includes(plural2)) score += 12;
        }
      });
      if(cat.includes(q)) score += 25;
      return { product: p, score };
    }).filter(x=> x.score > 0).sort((a,b)=> b.score - a.score);
    products = scored.slice(0,8).map(x=> x.product);
  }
  const termPool = [...SUGGESTIONS, ...CATEGORIES];
  const terms = termPool.filter(s=>{
    const ns = normalizeText(s);
    return tokens.some(tok=> tok.length>=2 && ns.includes(tok)) || ns.includes(q);
  }).slice(0,6);
  const categories = CATEGORIES.filter(c=> normalizeText(c).includes(q)).slice(0,4);
  return { products, terms, categories };
}
async function fetchProductsForSuggestions(){
  try{
    if(window.supabase){
      const supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      const { data } = await supa.from('vendor_products').select('*').eq('is_approved', true).limit(100);
      if(data && data.length) allProductsCache = data;
    }
  }catch(e){}
  if(!allProductsCache.length){
    try{
      const bag = JSON.parse(localStorage.getItem('pb_bag')||'[]');
      const wl = JSON.parse(localStorage.getItem('pb_wishlist')||'[]');
      allProductsCache = [...bag, ...wl];
    }catch(e){}
  }
}
fetchProductsForSuggestions();
function renderDesktopSuggestions(query){
  const list = document.getElementById('suggestList');
  const dd = document.getElementById('suggestDropdown');
  if(!list || !dd) return;
  const { products, terms, categories } = getProductSuggestions(query);
  let html = '';
  if(products.length){
    html += products.map(p=>`
      <button data-term="${p.title}" class="suggest-item w-full text-left px-3 py-2.5 text-[13px] rounded-[10px] flex items-center gap-3">
        <span class="w-10 h-10 rounded-[8px] bg-[#F5F5F5] overflow-hidden shrink-0"><img src="${(p.images&&p.images[0])||''}" class="w-full h-full object-cover"/></span>
        <span class="flex-1 min-w-0"><span class="block truncate font-medium">${p.title}</span><span class="block text-[11px] text-black/40">GHS ${parseFloat(p.price||0).toFixed(2)} • ${p.category||'General'}</span></span>
        <span class="opacity-40"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></span>
      </button>
    `).join('');
  }
  if(categories.length){
    html += `<div class="mt-2 pt-2 border-t border-black/5"><p class="text-[10px] font-bold tracking-widest text-black/30 px-3 py-1">CATEGORIES</p>` + categories.map(c=>`
      <button data-term="${c}" class="suggest-item w-full text-left px-3 py-2 text-[13px] rounded-[10px] flex items-center gap-2"><span class="w-6 h-6 rounded-full bg-black text-white flex items-center justify-center text-[10px]">C</span>${c}<span class="ml-auto opacity-40"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></span></button>
    `).join('') + `</div>`;
  }
  if(terms.length){
    const filtered = terms.filter(t=> !products.find(p=> p.title.toLowerCase()===t.toLowerCase()));
    if(filtered.length) html += `<div class="${products.length||categories.length?'mt-2 pt-2 border-t border-black/5':''}"><p class="text-[10px] font-bold tracking-widest text-black/30 px-3 py-1">SEARCHES</p>` + filtered.slice(0,5).map(t=>`
      <button data-term="${t}" class="suggest-item w-full text-left px-3 py-2 text-[13px] rounded-[10px] flex items-center gap-3"><span class="w-6 h-6 rounded-full bg-[#F5F5F5] flex items-center justify-center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></span>${t}</button>
    `).join('') + `</div>`;
  }
  if(!html) html = SUGGESTIONS.slice(0,6).map(t=>`<button data-term="${t}" class="suggest-item w-full text-left px-3 py-2 text-[13px] rounded-[10px] flex items-center gap-3"><span class="w-6 h-6 rounded-full bg-[#F5F5F5] flex items-center justify-center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></span>${t}</button>`).join('');
  list.innerHTML = html;
  dd.classList.add('is-open');
}
function renderMobileSuggestions(query){
  const list = document.getElementById('mobileSuggestList');
  const dd = document.getElementById('mobileSuggestDropdown');
  if(!list || !dd) return;
  const { products, terms, categories } = getProductSuggestions(query);
  let html = '';
  if(products.length){
    html += products.map(p=>`
      <button data-term="${p.title}" class="w-full text-left p-2.5 rounded-[12px] border border-black/5 flex gap-3 hover:bg-[#FFF0F6]">
        <span class="w-12 h-12 rounded-[8px] bg-[#F5F5F5] overflow-hidden shrink-0"><img src="${(p.images&&p.images[0])||''}" class="w-full h-full object-cover"/></span>
        <span class="flex-1 min-w-0 text-left"><span class="block font-bold text-[13px] truncate">${p.title}</span><span class="block text-[11px] text-black/40">${p.category||'General'} • GHS ${parseFloat(p.price||0).toFixed(2)}</span></span>
        <span class="flex items-center opacity-40"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></span>
      </button>
    `).join('');
  }
  if(categories.length){
    html += `<div class="mt-2"><p class="text-[10px] font-bold tracking-widest text-black/30 px-2 py-1">CATEGORIES</p>` + categories.map(c=>`<button data-term="${c}" class="w-full text-left px-2 py-2.5 text-[14px] rounded-[10px] flex items-center gap-3 hover:bg-[#FFF0F6]"><span class="w-7 h-7 rounded-full bg-black text-white flex items-center justify-center text-[10px]">C</span>${c}<span class="ml-auto opacity-40"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></span></button>`).join('') + `</div>`;
  }
  if(terms.length){
    const filtered = terms.filter(t=> !products.find(p=> p.title.toLowerCase()===t.toLowerCase()));
    if(filtered.length) html += `<div class="mt-2"><p class="text-[10px] font-bold tracking-widest text-black/30 px-2 py-1">SEARCHES</p>` + filtered.slice(0,5).map(t=>`<button data-term="${t}" class="w-full text-left px-2 py-3 text-[14px] rounded-[10px] flex items-center gap-3 hover:bg-[#FFF0F6]"><span class="w-7 h-7 rounded-full bg-[#F5F5F5] flex items-center justify-center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2.2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></span>${t}</button>`).join('') + `</div>`;
  }
  if(!html) html = SUGGESTIONS.slice(0,6).map(t=>`<button data-term="${t}" class="w-full text-left px-2 py-3 text-[14px] rounded-[10px] flex items-center gap-3 hover:bg-[#FFF0F6]"><span class="w-7 h-7 rounded-full bg-[#F5F5F5] flex items-center justify-center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2.2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></span>${t}</button>`).join('');
  list.innerHTML = html;
  dd.classList.remove('hidden');
  dd.classList.add('is-open');
}
function openMobileHeaderSearch(){
  const mh = document.getElementById('mobileHeaderSearch');
  const hr = document.getElementById('headerMainRow');
  if(mh){ mh.classList.remove('hidden'); mh.classList.add('is-open'); }
  if(hr) hr.classList.add('is-hidden');
  setTimeout(()=>{ const inp = document.getElementById('mobileSearchInput'); if(inp){ inp.focus(); renderMobileSuggestions(inp.value||''); } }, 80);
}
function closeMobileHeaderSearch(){
  const mh = document.getElementById('mobileHeaderSearch');
  const dd = document.getElementById('mobileSuggestDropdown');
  const hr = document.getElementById('headerMainRow');
  if(mh){ mh.classList.add('hidden'); mh.classList.remove('is-open'); }
  if(dd){ dd.classList.add('hidden'); dd.classList.remove('is-open'); }
  if(hr) hr.classList.remove('is-hidden');
}
const searchInput = document.getElementById('searchInput');
const suggestDropdown = document.getElementById('suggestDropdown');
if(searchInput){
  searchInput.addEventListener('focus', ()=> renderDesktopSuggestions(searchInput.value));
  searchInput.addEventListener('input', (e)=>{
    const q = e.target.value.trim();
    if(!q){ document.getElementById('suggestList').innerHTML=''; suggestDropdown.classList.remove('is-open'); return; }
    renderDesktopSuggestions(q);
  });
  searchInput.addEventListener('keydown', (e)=>{
    if(e.key==='Enter'){
      const q = e.target.value.trim();
      if(q) window.location.href = `/index.html?search=${encodeURIComponent(q)}`;
    }
  });
}
document.getElementById('suggestList')?.addEventListener('click', (e)=>{
  const btn = e.target.closest('[data-term]');
  if(btn){ window.location.href = `/index.html?search=${encodeURIComponent(btn.dataset.term)}`; }
});
document.getElementById('mobileSuggestList')?.addEventListener('click', (e)=>{
  const btn = e.target.closest('[data-term]');
  if(btn){ closeMobileHeaderSearch(); window.location.href = `/index.html?search=${encodeURIComponent(btn.dataset.term)}`; }
});
document.addEventListener('click', (e)=>{
  if(!e.target.closest('#searchInput') && !e.target.closest('#suggestDropdown')){
    suggestDropdown?.classList.remove('is-open');
  }
});
document.getElementById('mobileSearchBtn')?.addEventListener('click', (e)=>{
  e.stopPropagation();
  openMobileHeaderSearch();
});
document.getElementById('mobileSearchBackInline')?.addEventListener('click', closeMobileHeaderSearch);
const mobileSearchInput = document.getElementById('mobileSearchInput');
if(mobileSearchInput){
  mobileSearchInput.addEventListener('input', (e)=>{
    const q = e.target.value.trim();
    renderMobileSuggestions(q);
    if(searchInput) searchInput.value = q;
  });
  mobileSearchInput.addEventListener('keydown', (e)=>{
    if(e.key==='Enter'){
      const q = e.target.value.trim();
      if(q){ closeMobileHeaderSearch(); window.location.href = `/index.html?search=${encodeURIComponent(q)}`; }
    }
    if(e.key==='Escape') closeMobileHeaderSearch();
  });
}
// === WISHLIST LOGIC - UNCHANGED ===
function getWishlist(){ try{return JSON.parse(localStorage.getItem('pb_wishlist')||'[]')}catch(e){return []} }
function saveWishlist(wl){ localStorage.setItem('pb_wishlist', JSON.stringify(wl)); renderWishlist(); updateCounts(); }
function getGroups(){ try{return JSON.parse(localStorage.getItem('pb_wishlist_groups')||'[]')}catch(e){return []} }
function saveGroups(g){ localStorage.setItem('pb_wishlist_groups', JSON.stringify(g)); renderWishlist(); }
function getBag(){ try{return JSON.parse(localStorage.getItem('pb_bag')||'[]')}catch(e){return []} }
function saveBag(b){ localStorage.setItem('pb_bag', JSON.stringify(b)); updateCounts(); }
function updateCounts(){
  const wl=getWishlist(); const bag=getBag();
  const wc=document.getElementById('wishlistCount'); if(wc) wc.textContent=`${wl.length} ITEMS`;
  const bc=document.getElementById('bagCount'); if(bc){ const total= bag.reduce((a,b)=>a+(b.qty||1),0); bc.textContent=total; bc.style.display= total? 'flex':'none'; }
}
function showToast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.remove('hidden'); setTimeout(()=>t.classList.add('hidden'),2500); }
let pendingProductForHeart = null;
function renderWishlist(){
  const wl=getWishlist(); const groups=getGroups();
  document.getElementById('wishlistCount').textContent=`${wl.length} ITEMS`;
  const empty=document.getElementById('wishlistEmptyState'); const filled=document.getElementById('wishlistFilledState');
  if(!wl.length && !groups.length){ empty.classList.remove('hidden'); filled.classList.add('hidden'); updateCounts(); return; }
  empty.classList.add('hidden'); filled.classList.remove('hidden');
  document.getElementById('wishlistGroupsGrid').innerHTML = groups.sort((a,b)=> new Date(b.created_at)-new Date(a.created_at)).map(g=>{
    const total = (g.products||[]).reduce((a,b)=>a+parseFloat(b.price||0),0);
    return `
    <div class="bg-white border border-black/10 rounded-[20px] p-4">
      <div class="flex justify-between items-start">
        <div><h4 class="font-black text-[14px]">${g.name}</h4><p class="text-[11px] text-black/40 mt-1">${g.products.length} items • GHS ${total.toFixed(2)}</p></div>
        <div class="flex gap-1">
          <a href="card.html?group=${g.id}" class="w-8 h-8 rounded-full bg-black text-white flex items-center justify-center text-[12px]" title="Customize & Share">↗</a>
          <button onclick="deleteGroup('${g.id}')" class="w-8 h-8 rounded-full border border-black/10 flex items-center justify-center">✕</button>
        </div>
      </div>
      <div class="flex gap-1.5 mt-3">
        ${(g.products||[]).slice(0,4).map(p=>`<div class="w-12 h-12 rounded-[10px] bg-[#F5F5F5] overflow-hidden"><img src="${(p.images&&p.images[0])||''}" class="w-full h-full object-cover"/></div>`).join('')}
        ${g.products.length>4? `<div class="w-12 h-12 rounded-[10px] bg-black text-white flex items-center justify-center text-[10px] font-bold">+${g.products.length-4}</div>`:''}
      </div>
      <div class="mt-3 flex gap-2">
        <a href="card.html?group=${g.id}" class="flex-1 h-9 rounded-full bg-[#FF8EBA] text-black text-[11px] font-bold flex items-center justify-center">Customize card</a>
        <button onclick="addGroupToBag('${g.id}')" class="flex-1 h-9 rounded-full border border-black/10 text-[11px] font-bold">Add to bag</button>
      </div>
    </div>`;
  }).join('') || '<p class="text-[12px] text-black/40">No groups yet</p>';
  document.getElementById('wishlistItemsGrid').innerHTML = wl.map(p=>`
    <div class="bg-white border border-black/10 rounded-[16px] overflow-hidden">
      <a href="product.html?id=${p.id}" class="aspect-square bg-[#F5F5F5] block"><img src="${(p.images&&p.images[0])||''}" class="w-full h-full object-cover"/></a>
      <div class="p-3"><div class="font-bold text-[12px] truncate">${p.title}</div><div class="font-black text-[12px] mt-1">GHS ${parseFloat(p.price).toFixed(2)}</div>
      <div class="mt-2 grid grid-cols-2 gap-1"><button onclick="addToBag('${p.id}')" class="h-8 rounded-full bg-black text-white text-[10px] font-bold">Add to bag</button><button onclick="removeFromWishlist('${p.id}')" class="h-8 rounded-full border text-[10px] font-bold">Remove</button></div>
      <select onchange="addToGroup(this.value,'${p.id}'); this.value=''" class="mt-2 w-full h-8 rounded-full border text-[10px] px-2"><option value="">Add to group</option>${groups.map(g=>`<option value="${g.id}">${g.name}</option>`).join('')}</select></div>
    </div>
  `).join('');
  updateCounts();
}
function addToBag(id){ const wl=getWishlist(); const p=wl.find(x=>x.id===id)||getGroups().flatMap(g=>g.products).find(x=>x.id===id); if(!p) return; let bag=getBag(); const f=bag.find(x=>x.id===id); if(f) f.qty++; else bag.push({...p,qty:1}); saveBag(bag); showToast('Added to bag'); }
function removeFromWishlist(id){ saveWishlist(getWishlist().filter(x=>x.id!==id)); let groups=getGroups().map(g=>({...g,products:g.products.filter(p=>p.id!==id)})); saveGroups(groups); }
function addGroupToBag(groupId){ const g=getGroups().find(x=>x.id===groupId); if(!g) return; let bag=getBag(); g.products.forEach(p=>{ const f=bag.find(x=>x.id===p.id); if(f) f.qty++; else bag.push({...p,qty:1}); }); saveBag(bag); showToast('Group added to bag'); }
function deleteGroup(id){ if(!confirm('Delete group?')) return; saveGroups(getGroups().filter(g=>g.id!==id)); }
function addToGroup(groupId, productId){
  if(!groupId) return;
  const wl=getWishlist(); const p=wl.find(x=>x.id===productId); if(!p) return;
  let groups=getGroups(); const g=groups.find(x=>x.id===groupId); if(g && !g.products.find(x=>x.id===productId)) g.products.push(p); saveGroups(groups); showToast('Added to '+g.name);
}
function openHeartModal(product){
  pendingProductForHeart = product;
  document.getElementById('heartProductPreview').innerHTML = `<div class="w-12 h-12 rounded-[10px] bg-[#F5F5F5] overflow-hidden"><img src="${(product.images&&product.images[0])||''}" class="w-full h-full object-cover"/></div><div class="flex-1 min-w-0"><p class="font-bold text-[12px] truncate">${product.title}</p><p class="text-[11px] text-black/40">GHS ${parseFloat(product.price).toFixed(2)}</p></div>`;
  const groups=getGroups().sort((a,b)=> new Date(b.created_at)-new Date(a.created_at)).slice(0,6);
  document.getElementById('heartGroupsList').innerHTML = groups.map(g=>`<button onclick="addPendingToGroup('${g.id}')" class="w-full text-left p-3 rounded-[14px] border border-black/5 hover:bg-[#FFF0F6] flex items-center justify-between"><span class="font-bold text-[13px]">${g.name} <span class="font-normal text-black/40">• ${g.products.length}</span></span><span class="text-[10px]">↗</span></button>`).join('') || '<p class="text-[11px] text-black/40 px-2">No groups yet</p>';
  document.getElementById('heartGroupsModal').classList.remove('hidden'); document.getElementById('heartGroupsModal').classList.add('flex');
}
function closeHeartModal(){ document.getElementById('heartGroupsModal').classList.add('hidden'); document.getElementById('heartGroupsModal').classList.remove('flex'); pendingProductForHeart=null; }
function addPendingToGroup(groupId){
  if(!pendingProductForHeart) return;
  let groups=getGroups(); const g=groups.find(x=>x.id===groupId); if(g && !g.products.find(x=>x.id===pendingProductForHeart.id)) g.products.push(pendingProductForHeart);
  let wl=getWishlist(); if(!wl.find(x=>x.id===pendingProductForHeart.id)) wl.push(pendingProductForHeart); saveWishlist(wl); saveGroups(groups); closeHeartModal(); showToast('Added to '+g.name);
}
function addPendingToGeneral(){
  if(!pendingProductForHeart) return;
  let wl=getWishlist(); if(!wl.find(x=>x.id===pendingProductForHeart.id)) wl.push(pendingProductForHeart); saveWishlist(wl); closeHeartModal(); showToast('Saved to wishlist');
}
window.openHeartModal = openHeartModal;
window.addToBag = addToBag;
window.removeFromWishlist = removeFromWishlist;
window.addGroupToBag = addGroupToBag;
window.deleteGroup = deleteGroup;
window.addToGroup = addToGroup;
window.addPendingToGroup = addPendingToGroup;
document.getElementById('closeHeartModal')?.addEventListener('click', closeHeartModal);
document.getElementById('addToGeneralWishlistBtn')?.addEventListener('click', addPendingToGeneral);
document.getElementById('heartGroupsModal')?.addEventListener('click', (e)=>{ if(e.target.id==='heartGroupsModal') closeHeartModal(); });
document.getElementById('heartCreateNewGroupBtn')?.addEventListener('click', ()=>{ document.getElementById('createGroupModal').classList.remove('hidden'); document.getElementById('createGroupModal').classList.add('flex'); });
document.getElementById('closeGroupModal')?.addEventListener('click', ()=>{ document.getElementById('createGroupModal').classList.add('hidden'); document.getElementById('createGroupModal').classList.remove('flex'); });
document.getElementById('createGroupBtnTop')?.addEventListener('click', ()=>{ document.getElementById('createGroupModal').classList.remove('hidden'); document.getElementById('createGroupModal').classList.add('flex'); });
document.getElementById('saveGroupBtn')?.addEventListener('click', ()=>{
  const name=document.getElementById('groupNameInput').value.trim(); if(!name){ showToast('Enter name'); return; }
  const groups=getGroups(); const newGroup={id:'grp_'+Date.now(), name, description:'', products: pendingProductForHeart? [pendingProductForHeart] : [], created_at:new Date().toISOString()};
  groups.push(newGroup); saveGroups(groups);
  if(pendingProductForHeart){ let wl=getWishlist(); if(!wl.find(x=>x.id===pendingProductForHeart.id)) wl.push(pendingProductForHeart); saveWishlist(wl); }
  document.getElementById('createGroupModal').classList.add('hidden'); document.getElementById('createGroupModal').classList.remove('flex');
  document.getElementById('groupNameInput').value=''; closeHeartModal(); showToast('Group created');
  if(pendingProductForHeart){ pendingProductForHeart=null; }
});
renderWishlist();
updateCounts();
</script>
