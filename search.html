<!-- components/search.html — Claude Search Screen as Component -->
<style>
  .font-tagline { font-family: 'Indie Flower', cursive; }
  .scrollbar-none::-webkit-scrollbar { display: none; }
  .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }
  .sc-label { font-size: 10.5px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: #999; margin-bottom: 10px; }
  .sc-input { width: 100%; height: 40px; background: white; border: 1px solid #ddd; border-radius: 9px; padding: 0 12px; font-size: 13px; outline: none; }
  .sc-input:focus { border-color: black; }
  .sc-btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; background: black; color: white; font-weight: 700; font-size: 12.5px; height: 40px; padding: 0 18px; border-radius: 9px; transition: opacity 120ms ease; cursor: pointer; }
  .sc-btn:hover { opacity: 0.85; }
  .sc-btn-outline { display: inline-flex; align-items: center; justify-content: center; gap: 6px; background: white; color: black; font-weight: 700; font-size: 12.5px; height: 40px; padding: 0 18px; border-radius: 9px; border: 1.5px solid black; cursor: pointer; }
  .sc-chip { display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0; background: white; border: 1px solid #ddd; border-radius: 9px; padding: 6px 10px; font-size: 11.5px; font-weight: 600; }
  .sc-chip button { color: #999; line-height: 1; cursor: pointer; }
  .sc-chip button:hover { color: black; }
  .sc-link { color: #2563EB; font-weight: 700; font-size: 11.5px; cursor: pointer; }
  .sc-link:hover { text-decoration: underline; }
  #ssSheetPanel { transform: translateY(100%); transition: transform 240ms ease; }
  #ssSheet.is-open #ssSheetPanel { transform: translateY(0); }
  #ssSheetBackdrop { opacity: 0; transition: opacity 240ms ease; }
  #ssSheet.is-open #ssSheetBackdrop { opacity: 1; }
</style>
<section id="searchScreen" class="hidden fixed inset-x-0 bottom-0 z-40 overflow-y-auto bg-[#FAFAFA]" style="top:124px;">
  <div class="max-w-[1280px] mx-auto px-4 py-5">
    <div class="flex items-start justify-between gap-3 mb-4">
      <div class="min-w-0">
        <h2 id="ssTitle" class="font-black text-[18px] md:text-[20px] truncate">All products</h2>
        <p id="ssSub" class="text-[12px] text-black/45 mt-1">0 products found • Accra</p>
      </div>
      <button id="ssClose" aria-label="Close search" class="sc-btn-outline !px-0 w-10 shrink-0">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="grid grid-cols-1 lg:grid-cols-[260px_1fr] gap-6 items-start">
      <aside class="hidden lg:block bg-white border border-black/10 rounded-[14px] p-5 sticky top-0">
        <div id="ssFilterDesktop"></div>
      </aside>
      <div>
        <div class="flex items-center gap-2 mb-3">
          <button id="ssOpenSheet" class="sc-btn lg:hidden" type="button">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
            Filters
            <span id="ssFilterBadge" class="hidden bg-white text-black text-[10px] font-black min-w-[18px] h-[18px] rounded-[6px] items-center justify-center px-1">0</span>
          </button>
          <select id="ssSort" class="sc-input !w-auto ml-auto font-semibold">
            <option value="newest">Newest</option>
            <option value="price-low">Price: Low to High</option>
            <option value="price-high">Price: High to Low</option>
            <option value="rating-high">Highest Rated</option>
          </select>
        </div>
        <div id="ssChips" class="flex items-center gap-2 overflow-x-auto scrollbar-none mb-4"></div>
        <div id="ssGrid" class="grid grid-cols-2 md:grid-cols-3 gap-3"></div>
        <div id="ssEmpty" class="hidden flex-col items-center text-center py-20 bg-white border border-black/10 rounded-[14px] px-4">
          <svg class="text-[#ABABAB]" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <h3 id="ssEmptyTitle" class="font-black text-[16px] mt-4"></h3>
          <p id="ssEmptyText" class="text-black/50 text-[13px] mt-2 max-w-[320px]"></p>
          <button id="ssEmptyBtn" type="button" class="sc-btn mt-5"></button>
        </div>
      </div>
    </div>
  </div>
</section>
<div id="ssSheet" class="hidden fixed inset-0 z-[70]">
  <div id="ssSheetBackdrop" class="absolute inset-0 bg-black/40"></div>
  <div id="ssSheetPanel" class="absolute left-0 right-0 bottom-0 bg-white rounded-t-[18px] max-h-[88vh] flex flex-col">
    <div class="flex items-center justify-between px-5 pt-4 pb-3 border-b border-black/5">
      <p class="font-black text-[15px]">Filters</p>
      <button id="ssSheetClose" type="button" aria-label="Close filters" class="w-9 h-9 rounded-[9px] border border-black/10 flex items-center justify-center">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div id="ssFilterMobile" class="px-5 py-4 overflow-y-auto flex-1"></div>
    <div class="flex items-center gap-2 px-5 py-3 border-t border-black/5">
      <button id="ssSheetClear" type="button" class="sc-btn-outline flex-1">Clear all</button>
      <button id="ssSheetApply" type="button" class="sc-btn flex-[2]">Show results</button>
    </div>
  </div>
</div>
