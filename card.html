<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
<title>PLUSH BABES — Wishlist Card</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Indie+Flower&family=Inter:wght@400;600;700;900&family=Playfair+Display:wght@700&family=Space+Grotesk:wght@700&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Inter', sans-serif; background: #FAFAFA; -webkit-font-smoothing: antialiased; }

  /* Buttons & fields: all 9px */
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; height:40px; padding:0 18px; border-radius:9px; background:#000; color:#fff; font-weight:700; font-size:12.5px; transition:opacity .12s; }
  .btn:hover { opacity:.85; }
  .btn-o { display:inline-flex; align-items:center; justify-content:center; gap:6px; height:40px; padding:0 18px; border-radius:9px; background:#fff; color:#000; border:1.5px solid #000; font-weight:700; font-size:12.5px; cursor:pointer; }
  .field { width:100%; height:40px; border:1px solid #ddd; border-radius:9px; padding:0 12px; font-size:13px; background:#fff; outline:none; }
  .field:focus { border-color:#000; }
  textarea.field { height:84px; padding:10px 12px; resize:none; }
  .lbl { display:block; font-size:10.5px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:#888; margin-bottom:6px; }
  .sw { height:40px; border:1px solid #ddd; border-radius:9px; overflow:hidden; background:#fff; }
  .sw input { width:100%; height:100%; border:0; padding:4px; background:none; cursor:pointer; }

  .tpl { border:1.5px solid #e5e5e5; border-radius:9px; background:#fafafa; height:68px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px; font-size:10px; font-weight:700; color:#666; }
  .tpl.is-active { border-color:#000; color:#000; background:#fff; }

  /* Editor: sidebar on desktop, bottom sheet on mobile (hidden until "Customize") */
  #editor { background:#fff; border:1px solid #eee; border-radius:16px; }
  @media (max-width: 1023px) {
    #editor { position:fixed; left:0; right:0; bottom:0; z-index:70; max-height:86vh; overflow-y:auto; border:0; border-radius:18px 18px 0 0; transform:translateY(105%); transition:transform .24s ease; }
    #editor.is-open { transform:none; }
  }
  #backdrop { opacity:0; pointer-events:none; transition:opacity .24s; }
  #backdrop.is-open { opacity:1; pointer-events:auto; }

  /* Shared (view) mode: card only */
  body.is-view #editor, body.is-view #openEditor, body.is-view #backBtn, body.is-view #shareBtn { display:none; }
  body.is-view main { display:block; }
  #card.is-link { cursor:pointer; transition:transform .2s, box-shadow .2s; }
  #card.is-link:hover { transform:translateY(-4px); }
</style>
</head>
<body>

<header class="sticky top-0 z-30 bg-[#FF8EBA] h-[60px] flex items-center justify-between px-4">
  <button id="backBtn" onclick="history.back()" class="flex items-center gap-1 text-white font-bold text-[13px] w-20">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m15 18-6-6 6-6"/></svg>Back
  </button>
  <span id="topTitle" class="font-black text-white text-[14px]">Customize card</span>
  <button id="shareBtn" class="btn !h-9 w-20">Share</button>
</header>

<div id="backdrop" class="fixed inset-0 bg-black/40 z-[60]"></div>

<main class="max-w-[1000px] mx-auto px-4 py-6 pb-28 lg:pb-8 lg:grid lg:grid-cols-[340px_1fr] lg:gap-8 lg:items-start">

  <!-- EDITOR -->
  <aside id="editor" class="lg:sticky lg:top-[76px]">
    <div class="lg:hidden sticky top-0 bg-white flex items-center justify-between px-5 py-3 border-b border-black/5 z-10">
      <p class="font-black text-[15px]">Customize</p>
      <button id="closeEditor" aria-label="Close" class="w-9 h-9 rounded-[9px] border border-black/10 flex items-center justify-center">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <div class="p-5 space-y-5">
      <div>
        <span class="lbl">Template</span>
        <div id="tplGrid" class="grid grid-cols-3 gap-2"></div>
      </div>
      <div><label class="lbl" for="fTitle">Card title</label><input id="fTitle" class="field" placeholder="My Birthday Glam" /></div>
      <div><label class="lbl" for="fMsg">Message</label><textarea id="fMsg" class="field" placeholder="Help me slay ✨"></textarea></div>
      <div>
        <label class="lbl" for="fFont">Font</label>
        <select id="fFont" class="field">
          <option>Inter</option><option>Playfair Display</option><option>Space Grotesk</option><option>Indie Flower</option><option>Dancing Script</option>
        </select>
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div><span class="lbl">Text color</span><div class="sw"><input id="fText" type="color" value="#000000" /></div></div>
        <div><span class="lbl">Background</span><div class="sw"><input id="fBg" type="color" value="#FF8EBA" /></div></div>
      </div>
      <div>
        <span class="lbl">Background image</span>
        <div class="flex gap-2">
          <label class="btn-o flex-1 !h-10">Upload<input id="fImg" type="file" accept="image/*" class="hidden" /></label>
          <button id="rmImg" class="btn-o !h-10 !border-black/15 !text-black/60">Remove</button>
        </div>
      </div>
      <div>
        <label class="lbl" for="fCount">Items shown</label>
        <select id="fCount" class="field">
          <option value="3">3 + rest</option><option value="4">4 + rest</option><option value="6">6 + rest</option><option value="all">Show all</option>
        </select>
      </div>
      <div class="grid grid-cols-2 gap-2 pt-1">
        <button id="copyBtn" class="btn-o">Copy link</button>
        <button id="previewBtn" class="btn-o">Preview</button>
      </div>
      <button id="doneBtn" class="btn w-full lg:hidden">Done</button>
    </div>
  </aside>

  <!-- CARD -->
  <section id="stage" class="flex flex-col items-center">
    <div id="card" class="w-full max-w-[400px] min-h-[500px] rounded-[22px] overflow-hidden border border-black/10 shadow-[0_20px_60px_rgba(0,0,0,0.12)] flex flex-col"></div>
    <p id="hint" class="text-[12px] text-black/45 mt-4 text-center"></p>
  </section>
</main>

<button id="openEditor" class="btn lg:hidden fixed bottom-5 left-1/2 -translate-x-1/2 z-40 shadow-[0_8px_24px_rgba(0,0,0,0.25)] !h-11 !px-6">
  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 6h16M7 12h10M10 18h4"/></svg>Customize
</button>

<div id="toast" class="fixed bottom-24 lg:bottom-6 left-1/2 -translate-x-1/2 bg-black text-white text-[12px] font-bold px-4 py-2.5 rounded-[9px] hidden z-[100]"></div>

<script>
/* ===================== helpers ===================== */
const LS = 'pb_wishlist_groups';
const getGroups = () => { try { return JSON.parse(localStorage.getItem(LS) || '[]'); } catch (e) { return []; } };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const money = n => 'GH₵ ' + Number(n || 0).toFixed(2);
const $ = id => document.getElementById(id);
function toast(m) { const t = $('toast'); t.textContent = m; t.classList.remove('hidden'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.add('hidden'), 2400); }

const HEART = `<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>`;
const ARROW = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 12h14M13 6l6 6-6 6"/></svg>`;

/* ===================== state ===================== */
const params  = new URLSearchParams(location.search);
const groupId = params.get('group');
const isView  = params.get('shared') === '1';
const group   = getGroups().find(g => g.id === groupId);

let card = { template:'images', title: group?.name || 'My Wishlist', message: group?.description || 'Help me slay ✨',
             font:'Inter', textColor:'#000000', bgColor: group?.color || '#FF8EBA', bgImage:null, itemsCount:'3', ...(group?.card || {}) };

/* ===================== not found ===================== */
if (!group) {
  document.body.classList.add('is-view');
  $('stage').innerHTML = `
    <div class="text-center py-24">
      <svg class="mx-auto text-[#ABABAB]" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
      <h2 class="font-black text-[18px] mt-4">Wishlist not found</h2>
      <p class="text-black/50 text-[13px] mt-2">This link may be broken, or the wishlist was removed.</p>
      <button onclick="history.back()" class="btn mt-5">Go back</button>
    </div>`;
} else init();

function init() {
  if (isView) { document.body.classList.add('is-view'); $('topTitle').textContent = 'PLUSH BABES'; }

  /* ---------- templates ---------- */
  const TPL = {
    images:   ['Images',    '<rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="m21 16-5-5-8 8"/>'],
    text:     ['Text only', '<path d="M5 7h14M5 12h14M5 17h9"/>'],
    minimal:  ['Minimal',   '<rect x="3" y="8" width="5" height="8" rx="1"/><rect x="9.5" y="8" width="5" height="8" rx="1"/><rect x="16" y="8" width="5" height="8" rx="1"/>'],
    collage:  ['Collage',   '<rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/>'],
    polaroid: ['Polaroid',  '<rect x="5" y="3" width="14" height="18" rx="1.5"/><rect x="7.5" y="5.5" width="9" height="9"/>'],
    list:     ['List',      '<rect x="3" y="4" width="4" height="4" rx="1"/><rect x="3" y="10" width="4" height="4" rx="1"/><rect x="3" y="16" width="4" height="4" rx="1"/><path d="M10 6h11M10 12h11M10 18h11"/>'],
  };
  $('tplGrid').innerHTML = Object.entries(TPL).map(([k, [label, d]]) => `
    <button data-tpl="${k}" class="tpl ${k === card.template ? 'is-active' : ''}">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${d}</svg>${label}
    </button>`).join('');

  /* ---------- card rendering ---------- */
  const thumb = p => { const s = p.images && p.images[0]; return s ? `<img src="${esc(s)}" alt="" class="w-full h-full object-cover">` : `<div class="w-full h-full bg-white/30"></div>`; };
  const more  = (r, cls) => r > 0 ? `<div class="${cls} bg-black/30 text-white flex items-center justify-center text-[12px] font-bold">+${r}</div>` : '';

  const LAYOUT = {
    images:  (v, r) => `<div class="flex flex-wrap gap-2">${v.map(p => `<div class="w-16 h-16 rounded-[12px] overflow-hidden bg-white/20">${thumb(p)}</div>`).join('')}${more(r, 'w-16 h-16 rounded-[12px]')}</div>`,
    text:    (v, r, all) => `<ul class="space-y-1.5 text-[13px]">${all.map(p => `<li class="flex justify-between gap-3"><span class="truncate">• ${esc(p.title)}</span><span class="opacity-70 shrink-0">${money(p.price)}</span></li>`).join('')}</ul>`,
    minimal: (v, r) => `<div class="grid grid-cols-3 gap-2">${v.map(p => `<div class="aspect-square rounded-[10px] overflow-hidden bg-white/20">${thumb(p)}</div>`).join('')}${more(r, 'aspect-square rounded-[10px]')}</div>`,
    collage: (v, r) => `<div class="relative h-[250px]">${v.map((p, i) => `<div class="absolute w-[96px] h-[96px] rounded-[12px] overflow-hidden border-2 border-white shadow-md" style="left:${(i * 17) % 72}%;top:${(i * 31) % 150}px;transform:rotate(${i % 2 ? 5 : -5}deg)">${thumb(p)}</div>`).join('')}${r > 0 ? `<span class="absolute bottom-1 right-1 bg-black text-white px-3 py-1 rounded-[9px] text-[11px] font-bold">+${r} more</span>` : ''}</div>`,
    polaroid:(v, r) => `<div class="grid grid-cols-2 gap-3">${v.map((p, i) => `<div class="bg-white p-2 pb-5 rounded-[6px] shadow-md" style="transform:rotate(${i % 2 ? 2 : -2}deg)"><div class="aspect-square bg-[#F2F2F2] overflow-hidden">${thumb(p)}</div><p class="text-[10px] font-bold mt-2 text-black truncate">${esc(p.title)}</p></div>`).join('')}</div>${r > 0 ? `<p class="text-[11px] text-center opacity-70 mt-3">+${r} more</p>` : ''}`,
    list:    (v, r) => `<div class="space-y-2">${v.map(p => `<div class="flex items-center gap-2.5 bg-white/25 rounded-[10px] p-2"><div class="w-10 h-10 rounded-[8px] overflow-hidden bg-white/40 shrink-0">${thumb(p)}</div><span class="text-[12px] font-bold truncate">${esc(p.title)}</span><span class="ml-auto text-[11px] shrink-0">${money(p.price)}</span></div>`).join('')}${r > 0 ? `<p class="text-[11px] opacity-70 text-center">+${r} more</p>` : ''}</div>`,
  };

  const cardEl = $('card');
  function renderCard() {
    const items = group.products || [];
    const total = items.reduce((a, p) => a + (parseFloat(p.price) || 0), 0);
    const n = card.itemsCount === 'all' ? items.length : parseInt(card.itemsCount);
    const visible = items.slice(0, n), rest = items.length - visible.length;
    const edit = !isView ? 'contenteditable="true"' : '';

    cardEl.style.cssText = card.bgImage
      ? `background:linear-gradient(rgba(0,0,0,.28),rgba(0,0,0,.28)),url(${card.bgImage}) center/cover;`
      : `background:${card.bgColor};`;

    cardEl.innerHTML = `
      <div class="p-6 flex-1 flex flex-col" style="font-family:'${card.font}',sans-serif;color:${card.textColor}">
        <div class="flex items-center justify-between">
          <span class="text-[10px] font-bold tracking-[0.14em] uppercase opacity-70">Plush Babes · Wishlist</span>
          <span class="w-8 h-8 rounded-[9px] bg-white/30 flex items-center justify-center">${HEART}</span>
        </div>
        <h2 id="eTitle" ${edit} class="font-black text-[26px] leading-tight mt-4 outline-none">${esc(card.title)}</h2>
        <p id="eMsg" ${edit} class="text-[13.5px] opacity-80 mt-2 outline-none">${esc(card.message)}</p>
        <div class="mt-5">
          ${items.length ? LAYOUT[card.template](visible, rest, items) : '<p class="text-[12.5px] opacity-60">No items yet</p>'}
        </div>
        <div class="mt-auto pt-6">
          <div class="h-px bg-current opacity-20"></div>
          <div class="flex items-end justify-between gap-3 mt-4">
            <div>
              <p class="text-[10px] font-bold tracking-widest uppercase opacity-60">Total</p>
              <p class="font-black text-[24px] leading-none mt-1">${money(total)}</p>
              <p class="text-[11px] opacity-60 mt-1">${items.length} item${items.length === 1 ? '' : 's'}</p>
            </div>
            <span class="inline-flex items-center gap-1.5 h-10 px-4 rounded-[9px] bg-black text-white text-[12px] font-bold shrink-0">Join GroupPay ${ARROW}</span>
          </div>
        </div>
      </div>`;

    if (!isView) {
      $('eTitle').addEventListener('blur', e => { card.title = e.target.innerText.trim(); $('fTitle').value = card.title; });
      $('eMsg').addEventListener('blur',   e => { card.message = e.target.innerText.trim(); $('fMsg').value = card.message; });
    }
  }

  /* ---------- shared view: whole card joins GroupPay ---------- */
  function joinGroupPay() {
    // Hook up your join flow here, e.g.:
    window.location.href = `groupay.html?group=${encodeURIComponent(groupId)}`;
  }
  if (isView) {
    cardEl.classList.add('is-link');
    cardEl.setAttribute('role', 'link'); cardEl.tabIndex = 0;
    cardEl.addEventListener('click', joinGroupPay);
    cardEl.addEventListener('keydown', e => { if (e.key === 'Enter') joinGroupPay(); });
    $('hint').textContent = 'Tap the card to join this GroupPay';
  }

  /* ---------- editor wiring ---------- */
  $('fTitle').value = card.title; $('fMsg').value = card.message; $('fFont').value = card.font;
  $('fText').value = card.textColor; $('fBg').value = card.bgColor; $('fCount').value = card.itemsCount;

  const bind = (id, key, ev = 'input', after) => $(id).addEventListener(ev, e => { card[key] = e.target.value; if (after) after(); renderCard(); });
  bind('fTitle', 'title'); bind('fMsg', 'message'); bind('fFont', 'font', 'change');
  bind('fText', 'textColor'); bind('fBg', 'bgColor', 'input', () => { card.bgImage = null; });
  bind('fCount', 'itemsCount', 'change');

  $('tplGrid').addEventListener('click', e => {
    const b = e.target.closest('[data-tpl]'); if (!b) return;
    card.template = b.dataset.tpl;
    document.querySelectorAll('[data-tpl]').forEach(x => x.classList.toggle('is-active', x === b));
    renderCard();
  });

  // Background image: stored in localStorage for now, so keep it small.
  // UPLOAD FOR: when you move to Supabase, upload to Storage and save the URL instead.
  $('fImg').addEventListener('change', e => {
    const f = e.target.files[0]; if (!f) return;
    if (f.size > 1.5 * 1024 * 1024) { toast('Image too large (max 1.5 MB)'); e.target.value = ''; return; }
    const r = new FileReader(); r.onload = ev => { card.bgImage = ev.target.result; renderCard(); }; r.readAsDataURL(f);
  });
  $('rmImg').addEventListener('click', () => { card.bgImage = null; $('fImg').value = ''; renderCard(); });

  /* ---------- sheet (mobile) ---------- */
  const editor = $('editor'), backdrop = $('backdrop');
  const openSheet  = () => { editor.classList.add('is-open'); backdrop.classList.add('is-open'); };
  const closeSheet = () => { editor.classList.remove('is-open'); backdrop.classList.remove('is-open'); };
  $('openEditor').addEventListener('click', openSheet);
  ['closeEditor', 'doneBtn'].forEach(id => $(id).addEventListener('click', closeSheet));
  backdrop.addEventListener('click', closeSheet);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

  /* ---------- save + share ---------- */
  function saveCard() {
    const gs = getGroups(), g = gs.find(x => x.id === groupId);
    if (g) { g.card = card; try { localStorage.setItem(LS, JSON.stringify(gs)); } catch (e) { toast('Could not save (image too large?)'); } }
  }
  const shareUrl = () => `${location.origin}${location.pathname}?group=${encodeURIComponent(groupId)}&shared=1`;
  const copy = async msg => { try { await navigator.clipboard.writeText(shareUrl()); toast(msg); } catch (e) { toast('Copy failed'); } };

  $('shareBtn').addEventListener('click', async () => {
    saveCard();
    if (navigator.share && /Mobi|Android/i.test(navigator.userAgent)) {
      try { await navigator.share({ title: card.title, text: card.message, url: shareUrl() }); return; }
      catch (e) { if (e.name === 'AbortError') return; }
    }
    copy('Share link copied');
  });
  $('copyBtn').addEventListener('click', () => { saveCard(); copy('Link copied'); });
  $('previewBtn').addEventListener('click', () => { saveCard(); window.open(shareUrl(), '_blank'); });

  renderCard();
}
</script>
</body>
</html>
