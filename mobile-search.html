<!-- Mobile Search - shows suggestions from product names -->
<div id="mobileSearchScreen" class="fixed inset-0 bg-white z-[200] hidden">
  <div class="flex items-center gap-2 px-4 h-[60px] border-b border-black/5">
    <button id="mobileSearchBack" aria-label="Back" class="w-9 h-9 rounded-full flex items-center justify-center text-black hover:bg-black/5">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
    </button>
    <div class="flex-1 h-[40px] bg-[#F5F5F5] rounded-full flex items-center px-4 gap-2">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2.2" class="opacity-40 shrink-0"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="mobileSearchInput" placeholder="Search Plush Babes" autocomplete="off" class="bg-transparent outline-none text-[14px] w-full placeholder:text-black/40" />
    </div>
  </div>
  <div class="overflow-y-auto h-[calc(100vh-60px)] px-4 py-4">
    <p class="text-[10px] font-bold tracking-widest text-black/40 px-1 mb-2">SUGGESTIONS</p>
    <div id="mobileSearchSuggestions" class="space-y-1"></div>
    <div id="mobileSearchProducts" class="mt-6 hidden">
      <p class="text-[10px] font-bold tracking-widest text-black/40 px-1 mb-2">PRODUCTS</p>
      <div id="mobileSearchProductList" class="space-y-2"></div>
    </div>
  </div>
</div>
<style>
  #mobileSearchScreen.is-open { display: block !important; }
</style>
